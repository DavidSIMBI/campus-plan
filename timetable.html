<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>document.documentElement.dataset.theme = localStorage.getItem("campusplan_theme") || "light";</script>
    <title>Timetable | CampusPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="timetable">
    <header class="site-header">
      <a class="brand" href="index.html">Campus<span>Plan</span></a
      ><button
        class="menu-toggle"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Dashboard</a
        ><a href="assignments.html">Assignments</a
        ><a href="tests.html">Tests &amp; Exams</a
        ><a href="presentations.html">Presentations</a
        ><a class="active" href="timetable.html">Timetable</a
        ><a href="messages.html">Messages</a><a href="groups.html">Groups</a>
      </nav>
      <button class="profile" aria-label="Open profile menu">
        <span class="avatar">AN</span><span class="profile-name">Amina N.</span
        ><span>⌄</span>
      </button>
    </header>
    <main class="page-shell">
      <section class="page-title">
        <div>
          <p class="eyebrow">WEEKLY SCHEDULE</p>
          <h1>Timetable</h1>
          <p>16 – 20 September 2026</p>
        </div>
        <button class="button" type="button" data-open-modal="timetable-modal">
          Add Class
        </button>
      </section>
      <section id="timetable-list" class="timetable-list" aria-live="polite"></section>
    </main>
    <div class="modal" id="timetable-modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="timetable-modal-title">
        <button class="modal-close" aria-label="Close class form" data-close-modal>&times;</button>
        <h2 id="timetable-modal-title">Add class</h2>
        <form id="timetable-form" class="form-grid">
          <input id="timetable-id" type="hidden" />
          <label class="full">Course/Module name<input id="timetable-course" required /></label>
          <label>Course code<input id="timetable-code" /></label>
          <label>Day<select id="timetable-day" required><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label>
          <label>Start time<input id="timetable-start" type="time" required /></label>
          <label>End time<input id="timetable-end" type="time" required /></label>
          <label>Room<input id="timetable-room" /></label>
          <label>Lecturer<input id="timetable-lecturer" /></label>
          <label class="full">Notes<textarea id="timetable-notes" rows="3"></textarea></label>
          <p class="field-error full" id="timetable-error" role="alert"></p>
          <div class="form-actions full"><button class="button secondary" type="button" data-close-modal>Cancel</button><button class="button" type="submit">Save class</button></div>
        </form>
      </section>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
