<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("campusplan_theme") || "light";
    </script>
    <title>Messages | CampusPlan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="messages">
    <header class="site-header">
      <a class="brand" href="index.html">Campus<span>Plan</span></a
      ><button class="menu-toggle" aria-label="Open navigation">&#9776;</button>
      <nav class="main-nav">
        <a href="index.html">Dashboard</a
        ><a href="assignments.html">Assignments</a
        ><a href="tests.html">Tests &amp; Exams</a
        ><a href="presentations.html">Presentations</a
        ><a href="timetable.html">Timetable</a
        ><a class="active" href="messages.html">Messages</a
        ><a href="groups.html">Groups</a>
      </nav>
      <button class="profile">
        <span class="avatar">DN</span><span class="profile-name">David N.</span>
      </button>
    </header>
    <main class="page-shell">
      <section class="page-title small-title">
        <div>
          <p class="eyebrow">STUDENT CONNECTIONS</p>
          <h1>Messages</h1>
        </div>
        <button class="button" id="new-chat-button" type="button">
          + New message
        </button>
      </section>
      <section class="messaging-layout">
        <aside class="conversation-list">
          <label class="search" for="conversation-search"
            ><span class="visually-hidden">Search conversations</span><input
              id="conversation-search"
              type="search"
              placeholder="Search conversations..."
          /></label>
          <div class="message-tabs" role="tablist" aria-label="Messages views">
            <button class="message-tab active" id="chats-tab" type="button" role="tab" aria-selected="true" aria-controls="chats-view">Chats</button>
            <button class="message-tab" id="contacts-tab" type="button" role="tab" aria-selected="false" aria-controls="contacts-view">Contacts</button>
          </div>
          <section id="chats-view" role="tabpanel" aria-labelledby="chats-tab">
            <div id="conversation-list" aria-live="polite"></div>
          </section>
          <section id="contacts-view" role="tabpanel" aria-labelledby="contacts-tab" hidden>
            <label class="search contacts-search" for="contact-search"
              ><span class="visually-hidden">Search contacts</span><input
                id="contact-search"
                type="search"
                placeholder="Search contacts..."
            /></label>
            <div id="contact-list" aria-live="polite"></div>
          </section>
        </aside>
        <section class="chat-window" id="private-chat">
          <header class="chat-header">
            <button class="back-button" id="back-to-list">←</button
            ><span class="avatar" id="chat-avatar">SM</span>
            <div>
              <h2 id="chat-name">Sarah M.</h2>
              <p><i></i> <span id="chat-status">CampusPlan student</span></p>
            </div>
          </header>
          <div class="chat-messages" id="private-messages"></div>
          <form class="chat-compose" id="private-form">
            <input
              id="private-input"
              autocomplete="off"
              placeholder="Write a message..."
              aria-label="Message text"
            /><button
              class="send-button"
              type="submit"
              aria-label="Send message"
            >
              &#10148;
            </button>
          </form>
        </section>
      </section>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
