<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login | CampusPlan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand" href="login.html">Campus<span>Plan</span></a>
      <h1>Welcome Back <span aria-hidden="true">&#128075;</span></h1>
      <p>Log in to manage your academic life.</p>
      <p id="login-notice" class="form-notice" role="status"></p>
      <form id="login-form" class="form-grid">
        <label class="full"
          >Email or Student ID<input
            id="login-identity"
            autocomplete="username"
            required /></label
        ><label class="full"
          >Password<input
            id="login-password"
            type="password"
            autocomplete="current-password"
            required
        /></label>
        <p class="field-error full" id="login-error"></p>
        <button class="button full">Login</button>
      </form>
      <button class="text-button forgot-password">Forgot password?</button>
      <p class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
