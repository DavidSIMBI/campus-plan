<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("campusplan_theme") || "light";
    </script>
    <title>Create account | CampusPlan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card wide">
      <a class="brand" href="login.html">Campus<span>Plan</span></a>
      <h1>Create Your CampusPlan Account</h1>
      <p>Set up your academic space in a few moments.</p>
      <form id="register-form" class="form-grid">
        <label
          >Full Name<input id="reg-name" required /><span
            class="field-error"
          ></span></label
        ><label
          >Student ID<input id="reg-id" required /><span
            class="field-error"
          ></span></label
        ><label
          >Email<input id="reg-email" type="email" required /><span
            class="field-error"
          ></span></label
        ><label
          >University/Institution<input id="reg-institution" required /><span
            class="field-error"
          ></span></label
        ><label
          >Course/Program<input id="reg-program" required /><span
            class="field-error"
          ></span></label
        ><label
          >Year of Study<select id="reg-year" required>
            <option value="">Select year</option>
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
            <option value="Year 4">Year 4</option></select
          ><span class="field-error"></span></label
        ><div class="password-form-field">
          <label for="reg-password">Password</label>
          <span class="password-field">
            <input
              id="reg-password"
              type="password"
              minlength="6"
              required
            />
            <button
              class="password-toggle"
              type="button"
              data-password-toggle
              aria-label="Show password"
              aria-controls="reg-password"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <g class="password-eye">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </g>
                <g class="password-eye-off" hidden>
                  <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                  <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4.1-.8"></path>
                </g>
              </svg>
            </button>
          </span>
          <span class="field-error"></span>
        </div
        ><div class="password-form-field">
          <label for="reg-confirm">Confirm Password</label>
          <span class="password-field">
            <input id="reg-confirm" type="password" required />
            <button
              class="password-toggle"
              type="button"
              data-password-toggle
              aria-label="Show password"
              aria-controls="reg-confirm"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <g class="password-eye">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </g>
                <g class="password-eye-off" hidden>
                  <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                  <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4.1-.8"></path>
                </g>
              </svg>
            </button>
          </span>
          <span class="field-error"></span>
        </div>
        <p id="register-success" class="form-notice full"></p>
        <button class="button full">Create Account</button>
      </form>
      <p class="auth-switch">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
