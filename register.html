<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Create account | CampusPlan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card wide">
      <a class="brand" href="login.html">Campus<span>Plan</span></a>
      <h1>Create Your CampusPlan Account</h1>
      <p>Set up your academic space in a few moments.</p>
      <form id="register-form" class="form-grid">
        <label
          >Full Name<input id="reg-name" required /><span
            class="field-error"
          ></span></label
        ><label
          >Student ID<input id="reg-id" required /><span
            class="field-error"
          ></span></label
        ><label
          >Email<input id="reg-email" type="email" required /><span
            class="field-error"
          ></span></label
        ><label
          >University/Institution<input id="reg-institution" required /><span
            class="field-error"
          ></span></label
        ><label
          >Course/Program<input id="reg-program" required /><span
            class="field-error"
          ></span></label
        ><label
          >Year of Study<select id="reg-year" required>
            <option value="">Select year</option>
            <option>Year 1</option>
            <option>Year 2</option>
            <option>Year 3</option>
            <option>Year 4</option></select
          ><span class="field-error"></span></label
        ><label
          >Password<input
            id="reg-password"
            type="password"
            minlength="6"
            required /><span class="field-error"></span></label
        ><label
          >Confirm Password<input
            id="reg-confirm"
            type="password"
            required /><span class="field-error"></span
        ></label>
        <p id="register-success" class="form-notice full"></p>
        <button class="button full">Create Account</button>
      </form>
      <p class="auth-switch">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
