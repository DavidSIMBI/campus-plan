<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentations | CampusPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="presentations">
    <header class="site-header">
      <a class="brand" href="index.html">Campus<span>Plan</span></a
      ><button
        class="menu-toggle"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        &#9776;
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Dashboard</a
        ><a href="assignments.html">Assignments</a
        ><a href="tests.html">Tests &amp; Exams</a
        ><a class="active" href="presentations.html">Presentations</a
        ><a href="timetable.html">Timetable</a
        ><a href="messages.html">Messages</a><a href="groups.html">Groups</a>
      </nav>
      <button class="profile" aria-label="Open profile menu">
        <span class="avatar">DN</span><span class="profile-name">David N.</span
        ><span>&#8964;</span>
      </button>
    </header>
    <main class="page-shell">
      <section class="page-title">
        <div>
          <p class="eyebrow">SPEAKING &amp; TEAMWORK</p>
          <h1>Presentations</h1>
          <p>Plan your preparation and presentation days.</p>
        </div>
        <button class="button" data-open-modal="presentation-modal">
          + Add presentation
        </button>
      </section>
      <section class="assignment-grid" id="presentation-list"></section>
    </main>
    <div class="modal" id="presentation-modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section
        class="modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="presentation-modal-title"
      >
        <button class="modal-close" aria-label="Close form" data-close-modal>
          &times;
        </button>
        <h2 id="presentation-modal-title">Add presentation</h2>
        <form id="presentation-form" class="form-grid">
          <label
            >Presentation title<input id="presentation-title" required /></label
          ><label>Course<input id="presentation-course" required /></label
          ><label
            >Date<input id="presentation-date" type="date" required /></label
          ><label
            >Group name<input
              id="presentation-group"
              required
              placeholder="e.g. Group 1" /></label
          ><label class="full"
            >My assigned part<input
              id="presentation-part"
              required
              placeholder="e.g. Nutrition and BSIT" /></label
          ><label
            >Preparation status<select id="presentation-status">
              <option>Not Started</option>
              <option selected>Preparing</option>
              <option>Ready</option>
              <option>Completed</option>
            </select></label
          >
          <div class="form-actions full">
            <button type="button" class="button secondary" data-close-modal>
              Cancel</button
            ><button class="button">Save presentation</button>
          </div>
        </form>
      </section>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
