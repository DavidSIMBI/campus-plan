<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("campusplan_theme") || "light";
    </script>
    <title>Groups | CampusPlan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="groups">
    <header class="site-header">
      <a class="brand" href="index.html">Campus<span>Plan</span></a
      ><button class="menu-toggle" aria-label="Open navigation">&#9776;</button>
      <nav class="main-nav">
        <a href="index.html">Dashboard</a
        ><a href="assignments.html">Assignments</a
        ><a href="tests.html">Tests &amp; Exams</a
        ><a href="presentations.html">Presentations</a
        ><a href="timetable.html">Timetable</a
        ><a href="messages.html">Messages</a
        ><a class="active" href="groups.html">Groups</a>
      </nav>
      <button class="profile">
        <span class="avatar">DN</span><span class="profile-name">David N.</span>
      </button>
    </header>
    <main class="page-shell">
      <section class="page-title">
        <div>
          <p class="eyebrow">LEARN TOGETHER</p>
          <h1>Groups</h1>
          <p>Course communities and focused study spaces.</p>
        </div>
        <button class="button" data-open-modal="group-modal">
          + Create group
        </button>
      </section>
      <section class="groups-layout" id="groups-layout">
        <aside class="groups-sidebar">
          <label class="search" for="group-search"
            ><span class="visually-hidden">Search my groups</span><input
              id="group-search"
              type="search"
              placeholder="Search my groups..."
          /></label>
          <div class="group-tabs" role="tablist" aria-label="Group views">
            <button class="group-tab active" id="my-groups-tab" type="button" role="tab" aria-selected="true" aria-controls="my-groups-view">My Groups</button>
            <button class="group-tab" id="discover-tab" type="button" role="tab" aria-selected="false" aria-controls="discover-view">Discover</button>
          </div>
          <section id="my-groups-view" role="tabpanel" aria-labelledby="my-groups-tab">
            <div id="my-groups" aria-live="polite"></div>
          </section>
          <section id="discover-view" role="tabpanel" aria-labelledby="discover-tab" hidden>
            <label class="search groups-discover-search" for="discover-search"
              ><span class="visually-hidden">Search discoverable groups</span><input
                id="discover-search"
                type="search"
                placeholder="Search groups..."
            /></label>
            <div id="discover-groups" aria-live="polite"></div>
          </section>
        </aside>
        <section class="panel group-chat" id="group-chat" hidden>
        <header class="chat-header">
          <button class="back-button" id="group-back" type="button" aria-label="Back to groups">Back</button>
          <span class="avatar group-avatar">CP</span>
          <div>
            <h2 id="group-name"></h2>
            <p id="group-description"></p>
            <small id="group-course"></small>
            <small id="group-member-count"></small>
          </div>
          <button
            class="text-button chat-action"
            id="group-info-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="group-info"
          >
            Group info
          </button>
        </header>
        <div class="group-content">
          <div>
            <div class="chat-messages" id="group-messages"></div>
            <form class="chat-compose" id="group-form">
              <input
                id="group-input"
                placeholder="Message this group..."
                aria-label="Message this group"
              /><button
                class="send-button"
                type="submit"
                aria-label="Send group message"
              >
                &#10148;
              </button>
            </form>
          </div>
          <aside class="members" id="group-info" hidden>
            <h3>Group information</h3>
            <p id="group-students-status" class="empty-state" role="status" hidden></p>
            <p class="group-info-detail"><b>Course</b><span id="group-info-course"></span></p>
            <p class="group-info-detail"><b>Type</b><span id="group-info-type"></span></p>
            <label class="group-edit-field"
              >Group photo<input
                id="group-photo-input"
                type="file"
                accept="image/png,image/jpeg,image/gif,image/webp"
            /></label>
            <label class="group-edit-field"
              >Group name<input id="group-edit-name"
            /></label>
            <label class="group-edit-field"
              >Description<textarea
                id="group-edit-description"
                rows="2"
              ></textarea>
            </label>
            <button class="button small" id="group-save-info" type="button">
              Save group details
            </button>
            <div class="group-member-tools">
              <label class="group-edit-field"
                >Add member<select id="group-add-member"></select
              ></label>
              <button
                class="text-button"
                id="group-add-member-button"
                type="button"
              >
                Add
              </button>
            </div>
            <button class="text-button danger" id="group-leave" type="button">
              Leave group
            </button>
            <h3>Members</h3>
            <div id="member-list"></div>
          </aside>
        </div>
        </section>
      </section>
    </main>
    <div class="modal" id="group-modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-dialog">
        <button class="modal-close" data-close-modal>&times;</button>
        <h2>Create group</h2>
        <form id="group-create-form" class="form-grid">
          <label>Group name<input id="group-title" required /></label
          ><label>Course<input id="group-course" required /></label
          ><label class="full"
            >Description<textarea
              id="group-description-input"
              required
            ></textarea></label
          ><label
            >Group type<select id="group-type">
              <option>Study Group</option>
              <option>Assignment Group</option>
              <option>Presentation Group</option>
              <option>Course Community</option>
              <option>Other</option>
            </select></label
          >
          <div class="form-actions full">
            <button class="button">Create group</button>
          </div>
        </form>
      </section>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
