<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>document.documentElement.dataset.theme = localStorage.getItem("campusplan_theme") || "light";</script>
    <title>Assignments | CampusPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="assignments">
    <header class="site-header">
      <a class="brand" href="index.html">Campus<span>Plan</span></a
      ><button
        class="menu-toggle"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        &#9776;
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Dashboard</a
        ><a class="active" href="assignments.html">Assignments</a
        ><a href="tests.html">Tests &amp; Exams</a
        ><a href="presentations.html">Presentations</a
        ><a href="timetable.html">Timetable</a
        ><a href="messages.html">Messages</a><a href="groups.html">Groups</a>
      </nav>
      <button class="profile" aria-label="Open profile menu">
        <span class="avatar">DN</span><span class="profile-name">David N.</span
        ><span>&#8964;</span>
      </button>
    </header>
    <main class="page-shell">
      <section class="page-title">
        <div>
          <p class="eyebrow">YOUR COURSEWORK</p>
          <h1>Assignments</h1>
          <p>Keep track of every task and deadline.</p>
        </div>
        <button class="button" data-open-modal="assignment-modal">
          + Add assignment
        </button>
      </section>
      <section class="filters" aria-label="Filter assignments">
        <label class="filter-search"
          >Search assignments<input
            id="assignment-search"
            type="search"
            placeholder="Search by title or course" /></label
        ><label
          >Course<select id="course-filter">
            <option value="">All courses</option>
          </select></label
        ><label
          >Status<select id="status-filter">
            <option value="">All statuses</option>
            <option>Not Started</option>
            <option>In Progress</option>
            <option>Completed</option>
          </select></label
        ><label
          >Priority<select id="priority-filter">
            <option value="">All priorities</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select></label
        >
      </section>
      <section class="panel">
        <div class="panel-heading">
          <h2>All assignments</h2>
          <span class="muted" id="assignment-result-count"></span>
        </div>
        <div class="assignment-grid" id="assignment-list"></div>
      </section>
    </main>
    <div class="modal" id="assignment-modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section
        class="modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="assignment-modal-title"
      >
        <button class="modal-close" aria-label="Close form" data-close-modal>
          &times;
        </button>
        <h2 id="assignment-modal-title">Add assignment</h2>
        <form id="assignment-form" class="form-grid">
          <input type="hidden" id="assignment-id" /><label
            >Assignment title<input id="assignment-title" required /></label
          ><label
            >Course<input
              id="assignment-course"
              required
              placeholder="e.g. Database Design" /></label
          ><label class="full"
            >Description<textarea
              id="assignment-description"
              required
            ></textarea></label
          ><label
            >Due date<input id="assignment-date" type="date" required /></label
          ><label
            >Priority<select id="assignment-priority">
              <option>High</option>
              <option selected>Medium</option>
              <option>Low</option>
            </select></label
          ><label
            >Status<select id="assignment-status">
              <option>Not Started</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select></label
          >
          <div class="form-actions full">
            <button type="button" class="button secondary" data-close-modal>
              Cancel</button
            ><button class="button" type="submit">Save assignment</button>
          </div>
        </form>
      </section>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
